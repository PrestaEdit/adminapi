name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  MODULE_NAME: adminapi

jobs:
  release:
    name: Build & publish module ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        # Tag v1.0.0 -> VERSION=1.0.0 (used for the ZIP name and the version check).
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify module version matches tag
        # Guard against publishing a ZIP whose declared $this->version differs from
        # the git tag — a mismatch ships the wrong version number to PrestaShop.
        run: |
          DECLARED=$(awk -F"'" '/\$this->version[[:space:]]*=/{print $2; exit}' adminapi.php)
          if [ "$DECLARED" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag is v${{ steps.version.outputs.VERSION }} but adminapi.php declares $DECLARED"
            exit 1
          fi

      - name: Setup PHP 7.4
        # 7.4 is the canonical target; composer platform is pinned to it.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, openssl, json
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Stage module folder
        # PrestaShop installs a module from a ZIP whose top-level folder is named
        # after the module. rsync builds that clean tree, dropping dev-only files.
        run: |
          mkdir -p build/${MODULE_NAME}
          rsync -a ./ build/${MODULE_NAME}/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.claude' \
            --exclude 'build' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude 'var' \
            --exclude 'phpunit.xml' \
            --exclude 'phpunit.integration.xml' \
            --exclude '.phpunit.result.cache' \
            --exclude 'composer.lock'

      - name: Create ZIP
        run: |
          cd build
          zip -rq ${{ env.MODULE_NAME }}-${{ steps.version.outputs.VERSION }}.zip ${MODULE_NAME}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.MODULE_NAME }} ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: build/${{ env.MODULE_NAME }}-${{ steps.version.outputs.VERSION }}.zip
